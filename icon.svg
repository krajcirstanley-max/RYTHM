<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0c0c"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ec7f"/>
      <stop offset="100%" stop-color="#00c86a"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Subtle ring track -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="14"/>
  <!-- Progress arc (~75%) -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#arc)" stroke-width="14"
    stroke-linecap="round"
    stroke-dasharray="895 299"
    transform="rotate(-90 256 256)" opacity="0.9"/>
  <!-- Arc end glow -->
  <circle cx="256" cy="66" r="12" fill="rgba(0,236,127,0.25)"/>
  <!-- Stylized R letterform -->
  <path d="M210 170 L210 342" stroke="#fff" stroke-width="18" stroke-linecap="round" fill="none"/>
  <path d="M210 170 L270 170 Q310 170 310 208 Q310 246 270 246 L210 246" stroke="#fff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M260 246 L310 342" stroke="#00ec7f" stroke-width="18" stroke-linecap="round" fill="none"/>
</svg>
